{% set version = "1.3.11" %}
{% set name = "libxmlsec1" %}

package:
  name: libxmlsec1
  version: {{ version }}

source:
  url: https://github.com/lsh123/xmlsec/releases/download/{{ version }}/xmlsec1-{{ version }}.tar.gz
  sha256: 53675e98fa83b48201d24f7bfbcaeaa1b51496b8b19ff969785856bdeb196af3

build:
  number: 0
  run_exports:
    # compatibility is not tracked at abi-laboratory, assume same as libxml2
    - {{ pin_subpackage('libxmlsec1', max_pin='x.x') }}
  skip: true  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - make
    - libtool
  host:
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_8/configure.ac#L1567 -> GCRYPT_MIN_VERSION=1.4.0
    - libgcrypt 1.11.2
    - libgpg-error 1.51
    - libtool 2.4.7
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_8/configure.ac#L331 -> LIBXML_MIN_VERSION=2.9.13
    - libxml2 {{ libxml2 }}
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_8/configure.ac#L509 -> LIBXSLT_MIN_VERSION=1.1.35
    - libxslt {{ libxslt }}
    - openssl {{ openssl }}
  run:
    # Needed to resolve libltdl.so.7 in the dynamic section for libxmlsec1.so
    - {{ pin_compatible('libtool') }}

test:
  requires:
    - ripgrep
  commands:
    - xmlsec1 --help
    - xmlsec1 --version | rg {{ version }}

about:
  home: https://www.aleksey.com/xmlsec
  license: MIT
  license_family: MIT
  license_file: Copyright
  summary: XML Security Library
  description: |
    XML Security Library is a C library based on LibXML2.
    The library supports major XML security standards.
  dev_url: https://github.com/lsh123/xmlsec
  doc_url: https://www.aleksey.com/xmlsec/documentation.html

extra:
  skip-lints:  # due to the libtool issue explained above
    - build_tools_must_be_in_build
