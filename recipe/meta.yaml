{% set version = "1.3.12" %}
{% set name = "xmlsec" %}

package:
  name: lib{{ name }}1
  version: {{ version }}

source:
  url: https://github.com/lsh123/{{ name }}/releases/download/{{ version }}/{{ name }}1-{{ version }}.tar.gz
  sha256: 24045199af12d93fe5fdbbbf7e386e823e4842071e9432e2b90ac108b889a923

build:
  number: 0
  run_exports:
    # compatibility is not tracked at abi-laboratory, assume same as libxml2
    - {{ pin_subpackage('libxmlsec1', max_pin='x.x') }}
  skip: true  # [win]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - make
    - libtool
  host:
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_12/configure.ac#L1563 -> GCRYPT_MIN_VERSION=1.4.0
    - libgcrypt {{ libgcrypt }}
    - libgpg-error {{ libgpg_error }}
    - libtool 2.6.0
    - libltdl {{ libltdl }}
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_12/configure.ac#L327 -> LIBXML_MIN_VERSION=2.9.13
    - libxml2 {{ libxml2 }}
    # https://github.com/lsh123/xmlsec/blob/xmlsec_1_3_12/configure.ac#L505 -> LIBXSLT_MIN_VERSION=1.1.35
    - libxslt {{ libxslt }}
    - openssl {{ openssl }}
  run:
    # Needed to resolve libltdl.so.7 in the dynamic section for libxmlsec1.so
    - {{ pin_compatible('libltdl') }}

test:
  requires:
    - ripgrep
  commands:
    - xmlsec1 --help
    - xmlsec1 --version | rg {{ version }}

about:
  home: https://www.aleksey.com/xmlsec
  license: MIT
  license_family: MIT
  license_file: Copyright
  summary: XML Security Library
  description: |
    XML Security Library is a C library based on LibXML2.
    The library supports major XML security standards.
  dev_url: https://github.com/lsh123/xmlsec
  doc_url: https://www.aleksey.com/xmlsec/documentation.html

extra:
  skip-lints:  # due to the libtool issue explained above
    - build_tools_must_be_in_build
